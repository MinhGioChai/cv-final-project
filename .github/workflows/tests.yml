name: cpu-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-stage0.lock.txt
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m pytest -q -p no:cacheprovider
      - run: python scripts/check_repository.py
