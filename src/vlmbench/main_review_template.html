<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review main EN–VI</title>
<style>body{font:16px system-ui;max-width:1250px;margin:auto;padding:20px;background:#f4f6fa;color:#17243c}button,input,select,textarea{font:inherit;padding:9px;max-width:100%;box-sizing:border-box}button{cursor:pointer}.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:14px 0}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}.panel{background:white;padding:18px;border-radius:10px}img{width:100%;max-height:650px;object-fit:contain}label{display:block;margin:12px 0}textarea{width:100%;min-height:75px}#notice{color:#963900;min-height:30px}#hint{color:#785000}pre{white-space:pre-wrap}dialog{max-width:95vw}dialog img{max-height:85vh}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style>
<h1>Duyệt dữ liệu main</h1>
<p>Mỗi bản dịch cần hai người review khác nhau. QA ảnh/nhãn là quyết định riêng. Giữ nguyên phát biểu lạ và nhãn nguồn; ghi vấn đề thay vì sửa nhãn. Chưa xem thì giữ pending. Không có đáp án model trên trang.</p>
<div class="bar"><label>ID của bạn <input id="reviewer" autocomplete="off"></label><label>Phần đang duyệt <select id="mode"><option value="translation_1">Bản dịch — người 1</option><option value="translation_2">Bản dịch — người 2</option><option value="image_qa">Ảnh/nhãn</option></select></label><button id="download">Tải JSON review</button><label>Mở JSON đã lưu <input id="restore" type="file" accept=".json"></label></div>
<div class="bar"><button id="prev">← Trước</button><select id="jump" aria-label="Chọn mẫu"></select><button id="next">Sau →</button><span id="progress"></span></div>
<div class="grid"><div class="panel"><img id="image" alt="Ảnh cần review"><button id="zoomButton">Xem ảnh lớn</button><p id="identity"></p></div>
<div class="panel"><p id="en"></p><label>Bản dịch VI <textarea id="vi"></textarea></label><p id="hint"></p><p id="truth"></p><pre id="labels"></pre>
<label id="observedLabel">Đáp án bạn quan sát <input id="observed" placeholder="yes/no; số nguyên; A–H; hoặc uncertain"></label>
<label>Quyết định <select id="status"><option value="pending">Pending — chưa chốt</option><option value="approved">Approved — đã kiểm tra, đồng ý</option><option value="rejected">Rejected — cần xử lý</option></select></label>
<label>Ghi chú <textarea id="notes"></textarea></label><button id="save">Lưu mẫu / phần đang duyệt</button><p id="evidence"></p><p id="notice" role="status"></p></div></div>
<dialog id="zoom"><button id="closeZoom">Đóng</button><img id="largeImage" alt="Ảnh phóng lớn"></dialog>
<script type="application/json" id="payload">__MAIN_REVIEW_PAYLOAD__</script><script>
'use strict';
const payload=JSON.parse(document.getElementById('payload').textContent),cards=payload.cards,$=id=>document.getElementById(id);
let review=payload.review,index=0,mode='translation_1';
const key='vlmbench-main-review:'+review.context.manifest_sha256;
const blank=()=>({status:'pending',reviewer_id:'',reviewed_at:'',notes:'',reviewed_question_vi:'',observed_answer:''});
function validate(x){if(JSON.stringify(x.context)!==JSON.stringify(payload.review.context)||!Array.isArray(x.decisions)||x.decisions.length!==cards.length||new Set(x.decisions.map(d=>d.sample_id)).size!==cards.length||!cards.every(c=>x.decisions.some(d=>d.sample_id===c.sample_id)))throw Error('JSON sai context/IDs');for(const d of x.decisions){if(typeof d.question_vi!=='string')throw Error('VI không hợp lệ');for(const k of ['translation_1','translation_2','image_qa']){const p=d[k];if(!p||!['pending','approved','rejected'].includes(p.status)||!['reviewer_id','reviewed_at','notes','reviewed_question_vi','observed_answer'].every(f=>typeof p[f]==='string'))throw Error('Quyết định không hợp lệ');}}return x;}
try{const saved=localStorage.getItem(key);if(saved)review=validate(JSON.parse(saved));}catch(e){}
function decision(){return review.decisions.find(d=>d.sample_id===cards[index].sample_id);}
function stash(){try{localStorage.setItem(key,JSON.stringify(review));}catch(e){$('notice').textContent='Không lưu tự động được; hãy tải JSON.';}}
function render(){const c=cards[index],d=decision(),p=d[mode];$('image').src=c.image;$('identity').textContent=payload.packet+' · '+c.sample_id+' · '+c.task;$('en').textContent='EN: '+c.question_en;$('vi').value=d.question_vi;$('hint').textContent=c.review_note;$('truth').textContent='Nhãn nguồn: '+String(c.ground_truth)+(c.task==='spatial'?' (yes=TRUE, no=FALSE)':'');$('labels').textContent=Object.entries(c.labels).map(([k,v])=>k+': '+v).join('\n');$('observedLabel').hidden=mode!=='image_qa';$('observed').value=p.observed_answer;$('status').value=p.status;$('notes').value=p.notes;$('evidence').textContent=['translation_1','translation_2','image_qa'].map(k=>k+': '+d[k].status+(d[k].reviewer_id?' / '+d[k].reviewer_id:'')).join(' · ');$('jump').value=index;$('prev').disabled=index===0;$('next').disabled=index===cards.length-1;$('progress').textContent=(index+1)+'/'+cards.length;$('notice').textContent='';}
function dirty(){const d=decision(),p=d[mode];return $('vi').value!==d.question_vi||$('status').value!==p.status||$('notes').value!==p.notes||$('observed').value!==p.observed_answer;}
function navigate(n){if(dirty()){$('notice').textContent='Lưu thay đổi trước khi chuyển mẫu.';$('jump').value=index;return;}index=n;render();}
cards.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+' · '+c.image_id;$('jump').append(o);});
$('prev').onclick=()=>navigate(index-1);$('next').onclick=()=>navigate(index+1);$('jump').onchange=()=>navigate(Number($('jump').value));
$('mode').onchange=()=>{if(dirty()){$('mode').value=mode;$('notice').textContent='Lưu trước khi đổi phần duyệt.';return;}mode=$('mode').value;render();};
$('save').onclick=()=>{const d=decision(),c=cards[index],text=$('vi').value,status=$('status').value,notes=$('notes').value.trim(),id=$('reviewer').value.trim(),observed=$('observed').value.trim();if(!text.trim()){ $('notice').textContent='Bản dịch không được trống.';return;}if(status!=='pending'&&!id){$('notice').textContent='Nhập ID của chính bạn.';return;}if((status==='rejected'||(mode==='image_qa'&&observed==='uncertain'))&&!notes){$('notice').textContent='Cần ghi chú cho rejected/uncertain.';return;}if(mode==='image_qa'&&status!=='pending'){let normalized=observed;if(c.task==='counting'){if(!/^(0|[1-9][0-9]*|uncertain)$/.test(observed)){$('notice').textContent='Nhập số nguyên không âm hoặc uncertain.';return;}normalized=observed==='uncertain'?null:Number(observed);}else if(c.task==='fine_grained'){if(!/^[A-H]$|^uncertain$/.test(observed)){$('notice').textContent='Nhập A–H hoặc uncertain.';return;}}else if(!['yes','no','uncertain'].includes(observed)){$('notice').textContent='Nhập yes/no hoặc uncertain.';return;}if(status==='approved'&&normalized!==c.ground_truth){$('notice').textContent='Quan sát chưa khớp nhãn nguồn. Giữ pending/rejected và ghi chú.';return;}}
if(text!==d.question_vi){d.question_vi=text;d.translation_1=blank();d.translation_2=blank();}
const other=mode==='translation_1'?'translation_2':'translation_1';if(mode!=='image_qa'&&status==='approved'&&d[other].status==='approved'&&d[other].reviewer_id.trim().toLocaleLowerCase()===id.toLocaleLowerCase()){$('notice').textContent='Người review bản dịch thứ hai phải có ID khác.';return;}
d[mode]={status,reviewer_id:status==='pending'?'':id,reviewed_at:status==='pending'?'':new Date().toISOString(),notes,reviewed_question_vi:mode==='image_qa'?'':text,observed_answer:mode==='image_qa'?observed:''};stash();render();$('notice').textContent='Đã lưu. Tải JSON trước khi đóng; sửa VI làm mất hiệu lực hai quyết định dịch cũ.';};
$('download').onclick=()=>{if(dirty()){$('notice').textContent='Lưu mẫu hiện tại trước khi tải.';return;}const blob=new Blob([JSON.stringify(review,null,2)+'\n'],{type:'application/json;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=payload.packet+'_reviewed.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
$('restore').onchange=async()=>{try{if(dirty())throw Error('Lưu thay đổi trước khi mở JSON.');const file=$('restore').files[0];if(file){review=validate(JSON.parse(await file.text()));stash();render();}}catch(e){$('notice').textContent=e.message;}};
$('zoomButton').onclick=()=>{$('largeImage').src=$('image').src;$('zoom').showModal();};$('closeZoom').onclick=()=>$('zoom').close();render();
</script></html>
